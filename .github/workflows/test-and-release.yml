name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - 'master'
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '26.x'
                  type-checking: true
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        needs: check-and-lint
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ${{ matrix.os }}
        strategy:
            # Sparse matrix: 24.x (reference) on all three OSes, plus 22.x (the
            # engines floor) and 26.x (next) on ubuntu only -> 5 jobs. 22 + 24 live
            # in the top-level node-version array so the ioBroker repo-checker
            # (which reads only that array, ignoring include/exclude) sees both
            # required versions; exclude trims the redundant 22 x windows/macos jobs.
            matrix:
                node-version: ['22.x', '24.x']
                os: [ubuntu-latest, windows-latest, macos-latest]
                exclude:
                    - node-version: '22.x'
                      os: windows-latest
                    - node-version: '22.x'
                      os: macos-latest
                include:
                    - node-version: '26.x'
                      os: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  build: true

    # Deploys the final package to NPM
    deploy:
        needs: [check-and-lint, adapter-tests]

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        # Write permissions are required to create Github releases.
        # id-token: write is required for npm Trusted Publishing (OIDC).
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '26.x'
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
