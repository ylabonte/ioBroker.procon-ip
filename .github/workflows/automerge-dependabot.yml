# Workflow for auto-merging Dependabot PRs.
# Uses iobroker-bot-orga/action-automerge-dependabot, which reads the merge
# rules from .github/auto-merge.yml (see that file for the policy).
name: Auto-Merge Dependabot PRs

on:
  # WARNING: pull_request_target runs with write access in the context of the
  # base repository. Do NOT check out or execute untrusted PR code here.
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act on PRs opened by Dependabot
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-file-path: '.github/auto-merge.yml'
